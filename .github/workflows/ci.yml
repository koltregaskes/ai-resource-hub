name: CI (build + tests)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed SQLite baseline
        run: npm run seed

      - name: Typecheck
        run: npm run check

      - name: Run provenance tests
        run: npm run test:benchmark-provenance

      - name: Build site
        run: npm run build
