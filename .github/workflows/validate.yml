name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test benchmark provenance
        run: npm run test:benchmark-provenance

      - name: Test news routing provenance
        run: node --test scripts/news-pipeline-provenance.test.mjs scripts/lib/news-routing-config.test.mjs

      - name: Test internal link scanner
        run: node --test scripts/check-internal-links.test.mjs

      - name: Test news fetch intervals
        run: npx tsx --test scripts/news-feed-interval.test.ts

      - name: Verify publish readiness
        run: npm run verify:publish

      - name: Typecheck
        run: npm run check

      - name: Build Astro site
        run: npm run build

      - name: Check internal links
        run: npm run check:links

      - name: Lighthouse key pages
        run: npm run check:lighthouse
