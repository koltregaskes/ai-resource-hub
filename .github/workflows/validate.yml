name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test benchmark provenance
        run: npm run test:benchmark-provenance

      - name: Test news categories
        run: npm run test:news-categories

      - name: Test SEO sitemaps and ping safeguards
        run: npm run test:seo

      - name: Test frozen daily editions
        run: npm run test:editions

      - name: Test news routing provenance
        run: node --test scripts/news-pipeline-provenance.test.mjs scripts/lib/news-routing-config.test.mjs

      - name: Verify publish readiness
        run: npm run verify:publish

      - name: Build Astro site
        run: npm run build

  newsletter-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/newsletter
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/newsletter/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Test Worker in Miniflare (no network, no deploy)
        run: npm test
