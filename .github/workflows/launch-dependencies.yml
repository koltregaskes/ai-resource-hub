name: Launch dependency audit
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm ci --prefix workers/newsletter
      - run: npm audit --prefix workers/newsletter --audit-level=low
      - run: npm test --prefix workers/newsletter
