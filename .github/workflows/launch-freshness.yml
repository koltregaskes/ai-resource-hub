name: Hourly freshness honesty
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  honesty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test scripts/hourly-freshness.test.mjs
